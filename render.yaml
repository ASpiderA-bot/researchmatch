# Render blueprint: the API half of ResearchMatch v2.
# The React frontend lives on GitHub Pages and calls this service via VITE_API_BASE.
services:
  - type: web
    name: researchmatch-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_URL
        value: https://asidera-bot.github.io/researchmatch/
      - key: CORS_ORIGIN
        value: https://asidera-bot.github.io
